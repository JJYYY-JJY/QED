name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex-native-rewrite

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    env:
      UV_FROZEN: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: python-${{ matrix.python-version }}

      - name: Sync locked dependencies
        run: uv sync --all-groups --frozen

      - name: Lint Python
        run: uv run --frozen ruff check .

      - name: Type-check Python
        run: uv run --frozen mypy src

      - name: Run mocked test suite
        run: uv run --frozen pytest

      - name: Build Python package
        if: matrix.python-version == '3.14'
        run: uv build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Enforce tokenless browser boundary
        run: |
          if git grep -n -i -E '(authorization|bearer|qed\.session-token|VITE_[A-Z0-9_]*(TOKEN|KEY|SECRET))' -- \
            frontend/index.html \
            frontend/src \
            vite.config.ts \
            ':(exclude)frontend/src/*.test.ts' \
            ':(exclude)frontend/src/*.test.tsx' \
            ':(exclude)frontend/src/**/*.test.ts' \
            ':(exclude)frontend/src/**/*.test.tsx'; then
            echo 'Browser source must not contain API bearer credentials.' >&2
            exit 1
          fi

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run Impeccable security regressions
        run: npm run test:impeccable

      - name: Run Impeccable detector
        run: npm run impeccable

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
