[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "proofqed"
version = "0.1.0"
description = "Codex-native mathematical research with thread-isolated verifier checks"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "Junye Ji", email = "jijunye1@outlook.com" },
  { name = "Chenyang An" },
  { name = "Qihao Ye" },
  { name = "Minghao Pan" },
  { name = "Jiayun Zhang" },
]
dependencies = [
  "fastapi>=0.116",
  "openai-codex==0.1.0b3",
  "openai-codex-cli-bin==0.137.0a4",
  "pydantic==2.13.4",
  "pydantic-settings>=2.10",
  "structlog>=25.4",
  "tomli-w>=1.2",
  "typer>=0.16",
  "uvicorn[standard]>=0.35",
]

[project.scripts]
qed = "qed.cli:app"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.17",
  "mutmut>=3.3",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]

[tool.uv]
prerelease = "if-necessary-or-explicit"

[tool.hatch.build.targets.wheel]
packages = ["src/qed"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/qed",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -m 'not real_codex'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "real_codex: opt-in tests that invoke an authenticated Codex runtime",
]

[tool.mutmut]
source_paths = [
  "src/qed/domain/state.py",
  "src/qed/decision.py",
  "src/qed/stable_contracts.py",
  "src/qed/export.py",
  "src/qed/persistence/migrations.py",
]
also_copy = [
  "src/qed/__init__.py",
  "src/qed/__main__.py",
  "src/qed/api.py",
  "src/qed/bundle_verifier.py",
  "src/qed/config.py",
  "src/qed/doctor.py",
  "src/qed/evidence.py",
  "src/qed/inputs.py",
  "src/qed/logging.py",
  "src/qed/migration.py",
  "src/qed/model_outputs.py",
  "src/qed/operations.py",
  "src/qed/prompting.py",
  "src/qed/runtime",
  "src/qed/schemas.py",
  "src/qed/security",
  "src/qed/service.py",
  "src/qed/service_settings.py",
  "src/qed/state_machine.py",
  "src/qed/store.py",
  "src/qed/store_schema.py",
  "src/qed/workflow.py",
  "src/qed/workflow_support.py",
]
pytest_add_cli_args_test_selection = ["tests/test_state_machine.py", "tests/test_decision.py", "tests/test_export.py", "tests/test_bundle_verifier.py", "tests/test_persistence_migrations.py"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["proved_statements"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["qed"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["qed"]

[tool.coverage.report]
show_missing = true
skip_covered = true
